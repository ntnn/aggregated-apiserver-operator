apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: registry-minio
spec:
  schema:
    apiVersion: v1alpha1
    kind: RegistryWithStorage
    spec:
      name: string | required=true
      accessKey: string | default="minioadmin"
      secretKey: string | default="minioadmin"
    status:
      minioNodePort: ${minioService.spec.ports[0].nodePort}
      registryNodePort: ${registryService.spec.ports[0].nodePort}
  resources:
    - id: minio
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}-minio
          annotations:
            aggregation.ntnn.dev/cluster: storage
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: ${schema.spec.name}-minio
          template:
            metadata:
              labels:
                app: ${schema.spec.name}-minio
            spec:
              containers:
                - name: minio
                  image: minio/minio:RELEASE.2025-07-23T15-54-02Z
                  args:
                    - server
                    - /data
                    - --console-address
                    - ":9001"
                  env:
                    - name: MINIO_ROOT_USER
                      value: ${schema.spec.accessKey}
                    - name: MINIO_ROOT_PASSWORD
                      value: ${schema.spec.secretKey}
                  ports:
                    - containerPort: 9000
                    - containerPort: 9001
    - id: minioService
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}-minio
          annotations:
            aggregation.ntnn.dev/cluster: storage
        spec:
          type: NodePort
          selector:
            app: ${schema.spec.name}-minio
          ports:
            - name: api
              port: 9000
              targetPort: 9000
            - name: console
              port: 9001
              targetPort: 9001
    - id: registry
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}-registry
          annotations:
            aggregation.ntnn.dev/cluster: registry
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: ${schema.spec.name}-registry
          template:
            metadata:
              labels:
                app: ${schema.spec.name}-registry
            spec:
              initContainers:
                # create a bucket the registry can use
                - name: create-bucket
                  image: minio/mc:RELEASE.2025-07-21T05-28-08Z
                  command:
                    - /bin/sh
                    - -c
                  args:
                    - |
                      until mc alias set minio http://storage-control-plane:${string(minioService.spec.ports[0].nodePort)} ${schema.spec.accessKey} ${schema.spec.secretKey}; do
                        sleep 2
                      done
                      mc mb --ignore-existing minio/registry
              containers:
                - name: registry
                  image: registry:3
                  env:
                    - name: REGISTRY_STORAGE
                      value: s3
                    - name: REGISTRY_STORAGE_S3_REGIONENDPOINT
                      value: http://storage-control-plane:${string(minioService.spec.ports[0].nodePort)}
                    - name: REGISTRY_STORAGE_S3_REGION
                      value: us-east-1
                    - name: REGISTRY_STORAGE_S3_BUCKET
                      value: registry
                    - name: REGISTRY_STORAGE_S3_ACCESSKEY
                      value: ${schema.spec.accessKey}
                    - name: REGISTRY_STORAGE_S3_SECRETKEY
                      value: ${schema.spec.secretKey}
                    - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE
                      value: "true"
                    # route blob traffice through the registry instead
                    # of redirecting
                    - name: REGISTRY_STORAGE_REDIRECT_DISABLE
                      value: "true"
                  ports:
                    - containerPort: 5000
    - id: registryService
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}-registry
          annotations:
            aggregation.ntnn.dev/cluster: registry
        spec:
          type: NodePort
          selector:
            app: ${schema.spec.name}-registry
          ports:
            - port: 5000
              targetPort: 5000
