---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: aggregatedapis.aggregation.ntnn.dev
spec:
  group: aggregation.ntnn.dev
  names:
    kind: AggregatedAPI
    listKind: AggregatedAPIList
    plural: aggregatedapis
    singular: aggregatedapi
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AggregatedAPI is one endpoint aggregating a number of kube APIs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AggregatedAPISpec declares the clusters and APIs being aggregated.
            properties:
              clusters:
                description: Clusters lists the clusters being aggregated.
                items:
                  description: |-
                    AggregatedCluster selects one member cluster and the APIs served
                    from it.
                  properties:
                    access:
                      description: Access is how the cluster is accessed.
                      properties:
                        name:
                          description: KubeconfigName references a kubeconfig Secret
                            by name.
                          type: string
                      required:
                      - name
                      type: object
                    apis:
                      description: |-
                        APIs selects which APIs of the cluster are served.
                        A single entry with group "*" serves all discovered APIs.
                      items:
                        description: APISelector selects APIs by group, resource and
                          version.
                        properties:
                          group:
                            description: Group is the API group; "*" matches all groups.
                            type: string
                          resources:
                            description: |-
                              Resources are plural resource names; "*" or empty matches all
                              resources in the group.
                            items:
                              type: string
                            type: array
                          versions:
                            description: |-
                              Versions restricts served versions; empty means all discovered
                              versions.
                            items:
                              type: string
                            type: array
                        required:
                        - group
                        type: object
                      type: array
                  required:
                  - access
                  - apis
                  type: object
                type: array
            required:
            - clusters
            type: object
          status:
            description: AggregatedAPIStatus reports the state of the aggregation
              endpoint.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              url:
                description: URL is the endpoint serving this aggregated API.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
