apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-aggregator
  namespace: aggregated-apiserver-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-aggregator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-aggregator
subjects:
  - kind: ServiceAccount
    name: api-aggregator
    namespace: aggregated-apiserver-operator
